parent_dir = "exp/cardio/ddpm_mlp_best"
real_data_path = "data/cardio/"
num_numerical_features = 5
device = "cpu"
model_type = "mlp"
seed = 42
log_level = "info"

[deconsyn_params]
dataset_name = "cardio"
data_root = "data/cardio/"
categorical_columns = [
    "gender",
    "cholesterol",
    "gluc",
    "smoke",
    "alco",
    "active"
]
target = "cardio"

n = 10
epochs = 30
iterations = 1000
topology = "ring"
k = 4
p = 0.1
alpha = 1.0
gen_model_type = "tabddpm"
log_level = "info"

[model_params]
is_y_cond = true
num_classes = 2

[model_params.rtdl_params]
d_layers = [
    256,
    256,
    256,
    256,
    256,
    512,
]
dropout = 0.0

[diffusion_params]
num_timesteps = 1000
gaussian_loss_type = "mse"

[train.main]
steps = 30
lr = 0.0005666918237189449
weight_decay = 0.0
batch_size = 4096

[train.T]
seed = 0
normalization = "quantile"
num_nan_policy = "__none__"
cat_nan_policy = "__none__"
cat_min_frequency = "__none__"
cat_encoding = "__none__"
y_policy = "default"

[sample]
num_samples = 179200
batch_size = 20000
seed = 0

[eval.type]
eval_model = "mlp"
eval_type = "synthetic"

[eval.T]
seed = 0
normalization = "quantile"
num_nan_policy = "__none__"
cat_nan_policy = "__none__"
cat_min_frequency = "__none__"
cat_encoding = "one-hot"
y_policy = "default"
