seed=42
parent_dir = "exp/churn/ddpm_mlp_best"
real_data_path = "data/churn/"
num_numerical_features = 6
model_type = "mlp"
device = "cpu"

[deconsyn_params]
dataset_name = "churn"
data_root = "../../data/churn/"
categorical_columns = [
    'Geography',
    'Gender',
    'HasCrCard',
    'IsActiveMember'
]
target = "Exited"

n = 10
epochs = 30
iterations = 1000
topology = "ring"
k = 4
p = 0.1
alpha = 1.0
gen_model_type = "tabddpm"
log_level = "info"


[model_params]
num_classes = 2
is_y_cond = true

[model_params.rtdl_params]
d_layers = [
    512,
    1024,
    1024,
    1024,
    1024,
    256,
]
dropout = 0.0

[diffusion_params]
num_timesteps = 100
gaussian_loss_type = "mse"
scheduler = "cosine"

[train.main]
steps = 30
lr = 0.00015044197980173247
weight_decay = 0.0
batch_size = 256

[train.T]
seed = 0
normalization = "quantile"
num_nan_policy = "__none__"
cat_nan_policy = "__none__"
cat_min_frequency = "__none__"
cat_encoding = "__none__"
y_policy = "default"

[sample]
num_samples = 52000
batch_size = 10000
seed = 0

[eval.type]
eval_model = "mlp"
eval_type = "synthetic"

[eval.T]
seed = 0
normalization = "quantile"
num_nan_policy = "__none__"
cat_nan_policy = "__none__"
cat_min_frequency = "__none__"
cat_encoding = "one-hot"
y_policy = "default"
